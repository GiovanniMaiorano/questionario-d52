<meta charset="utf-8">
<style>
  :root {
    --txt:#1d1d1f; --muted:#5f5f66; --line:#e3e3e6; --soft:#f6f6f7; --bg:#f2f2f4;
    --err:#c62828; --errbg:#fdecec; --ok:#1e7d4f;
    --oro:#bd9134;        /* oro del logo UniSalento: elementi decorativi */
    --acc:#86611a;        /* oro scuro: elementi cliccabili (contrasto 5,6:1 sul bianco) */
    --accbg:#faf4e6;      /* fondo chiaro per note e selezioni */
    --fh:0px;             /* altezza della parte fissa (calcolata) */
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:16px; line-height:1.55; }
  .wrap { max-width:1060px; margin:0 auto; padding:20px 16px 60px; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:10px; font-size:14px; color:var(--muted); }
  .top b { color:var(--txt); font-weight:600; }
  .bar { height:4px; background:var(--line); border-radius:4px; overflow:hidden; margin-bottom:18px; }
  .bar > div { height:100%; background:var(--oro); transition:width .3s; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:24px 28px; margin-bottom:16px; }
  .eyebrow { font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--acc); font-weight:600; margin:0 0 6px; }
  h1 { font-size:24px; margin:0 0 14px; font-weight:600; line-height:1.3; }
  h2 { font-size:22px; margin:0 0 10px; font-weight:600; }
  h3 { font-size:18px; margin:22px 0 8px; font-weight:600; }
  .lead { font-size:17px; margin:0 0 6px; font-weight:500; }
  .muted { color:var(--muted); }
  .small { font-size:14px; }
  .desc { margin:0 0 14px; }
  ul.prat { list-style:none; padding:0; margin:0 0 14px; }
  ul.prat li { margin:3px 0; }
  ul.dims { padding-left:20px; margin:6px 0 12px; } ul.dims li { margin:4px 0; }
  details { margin:8px 0 12px; }
  summary { cursor:pointer; color:var(--acc); font-weight:500; font-size:15px; }
  .note { background:var(--accbg); border-left:4px solid var(--oro); border-radius:8px; padding:10px 14px; font-size:15px; margin:12px 0; }

  /* scala in verticale */
  .scala { list-style:none; padding:0; margin:6px 0 12px; }
  .scala li { display:flex; gap:10px; padding:4px 0; }
  .scala b { min-width:34px; display:inline-block; }

  /* parte fissa durante lo scorrimento (domanda, filtri, intestazioni) */
  .fisso { position:sticky; top:0; z-index:6; background:#fff; margin:0 -28px; padding:14px 28px 8px; border-bottom:1px solid var(--line); }
  .fisso .note { margin:10px 0 8px; }
  .fisso h2 { margin-bottom:6px; }
  .fisso .desc { margin-bottom:8px; }
  .fisso ul.prat { margin-bottom:6px; }
  .ctrl { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:6px 0 2px; }
  .ctrl .filter, .ctrl .seg { margin:0; }
  .ctrl .seg { flex:1; min-width:260px; }
  .scala.compatta { margin:4px 0 8px; } .scala.compatta li { padding:1px 0; font-size:15px; }
  .btntest { position:fixed; right:16px; bottom:16px; z-index:40; font-size:13px; padding:8px 12px; border-radius:10px; border:1px dashed #8e8e93; background:#fff; color:#5f5f66; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.12); }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#1d1d1f; color:#fff; padding:9px 16px; border-radius:10px; font-size:14px; z-index:50; }
  .fisso .domanda { font-size:16px; font-weight:600; margin:0 0 6px; }
  .fisso .mini { font-size:13px; color:var(--muted); margin:0 0 6px; display:flex; flex-wrap:wrap; gap:4px 14px; }
  .fisso .mini b { color:var(--txt); }
  thead th { position:sticky; top:calc(var(--fh) - 1px); background:#fff; z-index:4; border-bottom:1px solid var(--line); }

  .row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .rowlab { font-size:16px; font-weight:500; color:var(--txt); }
  .filter { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:8px 0 4px; }
  .filter label { cursor:pointer; }
  .filter input { position:absolute; opacity:0; width:1px; height:1px; }
  .filter span { position:relative; display:inline-block; padding:5px 14px; border:1.5px solid #c7c7cc; border-radius:20px; font-size:15px; }
  .filter input:checked + span { background:var(--acc); border-color:var(--acc); color:#fff; }
  .filter input:focus-visible + span { outline:2px solid var(--acc); outline-offset:2px; }

  /* interruttore «Mostra definizioni» */
  .switch { display:inline-flex; align-items:center; gap:10px; cursor:pointer; font-size:15px; font-weight:500; color:var(--acc); margin-left:auto; user-select:none; }
  .switch input { appearance:none; -webkit-appearance:none; width:42px; height:24px; border-radius:12px; background:#c7c7cc; position:relative; margin:0; cursor:pointer; transition:background .2s; }
  .switch input::after { content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:left .2s; box-shadow:0 1px 2px rgba(0,0,0,.25); }
  .switch input:checked { background:var(--acc); }
  .switch input:checked::after { left:21px; }
  .switch input:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }

  .seg { display:flex; background:var(--soft); border-radius:12px; padding:4px; margin:8px 0 6px; }
  .seg button { flex:1; border:0; background:transparent; padding:9px 6px; border-radius:9px; font-size:17px; color:var(--muted); cursor:pointer; position:relative; font-weight:500; }
  .seg button.on { background:#fff; color:var(--acc); box-shadow:0 0 0 1.5px var(--acc); font-weight:600; }
  .filter .badge { position:absolute; top:-7px; right:-7px; font-size:11px; font-weight:700; background:var(--err); color:#fff; border-radius:50%; width:17px; height:17px; line-height:17px; text-align:center; }
  .seg .badge { position:absolute; top:3px; right:8px; font-size:12px; font-weight:700; background:var(--err); color:#fff; border-radius:50%; width:18px; height:18px; line-height:18px; text-align:center; }

  .tablewrap { overflow-x:auto; }
  table { width:100%; border-collapse:separate; border-spacing:0; }
  th { font-size:14px; font-weight:600; text-align:center; padding:10px 6px; white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  td { padding:12px 6px; border-bottom:1px solid var(--line); text-align:center; vertical-align:middle; }
  td.cap { font-size:15px; min-width:210px; }
  td.cap .def { display:block; font-size:13px; color:var(--muted); margin-top:2px; }
  tr.missing td { background:var(--errbg); }
  label.opt { display:inline-flex; align-items:center; gap:7px; cursor:pointer; font-size:16px; }
  label.opt input { appearance:none; -webkit-appearance:none; width:22px; height:22px; border:1.5px solid #8e8e93; border-radius:50%; margin:0; cursor:pointer; display:grid; place-content:center; background:#fff; }
  label.opt input:checked { border-color:var(--acc); }
  label.opt input:checked::after { content:""; width:12px; height:12px; border-radius:50%; background:var(--acc); }
  select { font-size:15px; padding:7px 28px 7px 10px; border:1px solid #c7c7cc; border-radius:9px; background:#fff; min-width:74px; color:var(--txt); }
  select.vuoto { color:var(--muted); }
  .legend { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:10px 22px; font-size:14px; margin:8px 0 4px; }
  .legend .cl b { color:var(--txt); }
  .legend .cl span { display:block; color:var(--muted); font-size:13.5px; margin-top:2px; }
  .count { font-size:14px; color:var(--muted); margin:6px 0 0; }
  .err { background:var(--errbg); color:var(--err); border-radius:10px; padding:10px 14px; margin:10px 0; font-size:15px; display:none; }
  .err.show { display:block; }
  .nav { display:flex; justify-content:space-between; gap:12px; margin-top:6px; }
  button.btn { font-size:16px; padding:11px 22px; border-radius:11px; border:1px solid #c7c7cc; background:#fff; cursor:pointer; color:var(--txt); }
  button.btn.primary { background:var(--acc); color:#fff; border-color:var(--acc); font-weight:500; }
  button.btn:disabled { opacity:.45; cursor:default; }
  input[type=text] { width:100%; font-size:16px; padding:10px 12px; border:1px solid #c7c7cc; border-radius:10px; font-family:inherit; }
  input[type=text]:focus { outline:2px solid var(--acc); outline-offset:0; border-color:var(--acc); }
  .gl h3 { font-size:16px; margin:14px 0 6px; }
  .gl p { margin:3px 0; font-size:14px; }
  .mind { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin:10px 0 18px; }
  .mind .m { border:1px solid var(--bordo,#e3dccb); border-top:4px solid var(--oro); border-radius:12px; padding:12px 14px; background:#fffdf8; }
  .mind .m .lt { display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:50%; background:var(--oro); color:#fff; font-weight:700; font-size:17px; margin-bottom:6px; }
  .mind .m b { display:block; font-size:16px; margin-bottom:4px; }
  .mind .m span { font-size:14px; color:var(--muted); }
  table.info { width:100%; border-collapse:collapse; font-size:14px; margin:8px 0 18px; }
  table.info th, table.info td { border:1px solid #e3dccb; padding:7px 10px; text-align:left; vertical-align:top; }
  table.info th { background:#f6f1e4; }
  table.info tr.dim td { background:#faf6ec; font-weight:700; }
  table.info td.c1 { width:34%; }
  table.info .muted { display:block; margin-top:3px; }
  details.info-det { margin:8px 0 16px; } details.info-det > summary { padding:6px 0; } details.info-det[open] > summary { margin-bottom:6px; }
  .intro-a { margin:0 0 14px; } .intro-a p { margin:6px 0; }
  .firma { display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; border-top:2px solid var(--oro); margin-top:22px; padding-top:16px; }
  .firma p { margin:0; }
  .firma img { height:62px; width:auto; }
  .logo-fine { display:flex; justify-content:space-between; align-items:center; gap:28px; flex-wrap:wrap; border-top:2px solid var(--oro); margin-top:22px; padding-top:14px; } .logo-fine img { height:62px; width:auto; }
  .parte { border:1px solid var(--line); border-radius:12px; padding:14px 18px; margin:12px 0; }
  .parte h3 { margin:0 0 6px; }
  .done { text-align:center; padding:40px 20px; }
  .loghi-grazie { margin-top:22px; display:flex; justify-content:center; align-items:center; gap:36px; flex-wrap:wrap; } .loghi-grazie img { height:56px; width:auto; }
  /* ---- pagina dei risultati ---- */
  .sel { display:grid; grid-template-columns:2fr 1fr; gap:14px; }
  .sel label { display:block; font-size:14px; color:var(--muted); margin-bottom:4px; }
  .sel select { width:100%; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 2px; }
  .chip { font-size:13px; border-radius:20px; padding:3px 11px; background:var(--soft); color:var(--muted); }
  .chip.ok { background:#e3f4ea; color:#1e6b45; }
  .h3 { font-size:21px; font-weight:600; margin:0 0 10px; }
  table.res th { white-space:normal; text-align:left; vertical-align:bottom; font-weight:600; font-size:15px; }
  table.res td { text-align:left; padding:12px 6px; }
  table.res td.c, table.res th.c { text-align:center; }
  #ris2 td:first-child { white-space:nowrap; }
  .si { color:var(--ok); font-size:20px; font-weight:600; }
  .no { color:var(--muted); }
  tr.tot td { font-weight:600; border-bottom:0; }
  .box { border:1px solid var(--line); border-radius:14px; padding:20px 24px; margin-top:12px; }
  .box h4 { font-size:19px; font-weight:500; margin:0 0 14px; }
  .scores { display:grid; grid-template-columns:repeat(6,1fr); text-align:center; padding-bottom:16px; border-bottom:1px solid var(--line); }
  .scores span { display:block; color:var(--muted); font-size:15px; }
  .scores b { display:block; font-size:28px; font-weight:600; margin-top:4px; }
  .kpi { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-top:14px; }
  .kpi span { display:block; color:var(--muted); font-size:15px; }
  .kpi b { display:block; font-size:32px; font-weight:600; }
  .esito { display:inline-block; border-radius:8px; padding:3px 10px; font-size:14px; font-weight:600; }
  .e-Inclusa { background:#e3f4ea; color:#1e6b45; } .e-Esclusa { background:#fbe4e4; color:#a32626; } .e-Step4 { background:#fdf3d8; color:#8a5a00; }
  table.mat td { text-align:center; padding:9px 6px; cursor:pointer; font-variant-numeric:tabular-nums; }
  table.mat td:first-child { text-align:left; cursor:default; }
  table.mat td.on { outline:2px solid var(--txt); outline-offset:-2px; }
  table.mat tr.dim td { background:#fff; font-size:13px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); cursor:default; padding-top:16px; }
  .leg { display:flex; flex-wrap:wrap; gap:14px; font-size:14px; margin:12px 0 0; align-items:center; }
  .sw { display:inline-block; width:14px; height:14px; border-radius:4px; vertical-align:-2px; margin-right:5px; }
  .sel select { padding:9px 10px; }
  table.res:not(.mat) thead th { position:static; }
  table.mat thead th { top:0; }
  .testa { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; }
  .testa img { height:52px; }
  @media (min-width:701px) { .tablewrap { overflow:visible; } }
  @media (max-width:700px) {
    .sel { grid-template-columns:1fr; } .scores b { font-size:22px; } .kpi { grid-template-columns:1fr; } .testa img { display:none; }
    .fisso { position:static; margin:0; padding:8px 0; }
    thead th { position:static; }
    .card { padding:18px 14px; } h1 { font-size:21px; } h2 { font-size:19px; }
    .seg button { font-size:15px; }
  }
</style>

var stato = { nome: '', a: {}, b: {}, passo: 0, filtroA: 'Tutte', filtroB: 'Tutte', mostraDef: false };
var app = document.getElementById('app');

function el(html) { var d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild; }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function clusterDi(c) { for (var i = 0; i < DATI.cluster.length; i++) if (DATI.cluster[i].codice === c) return DATI.cluster[i]; }
function tutteCap() { var r = []; DATI.dimensioni.forEach(function (d) { d.capabilities.forEach(function (c) { r.push({ dim: d.sigla, codice: c.codice, nome: c.nome, definizione: c.definizione }); }); }); return r; }
function passi() { return ['intro', 'informativa'].concat(DATI.clusterA.map(function (c) { return 'A:' + c; })).concat(['B']); }
function etichetta(tipo) {
  if (tipo === 'intro') return 'Presentazione';
  if (tipo === 'informativa') return 'Informativa';
  if (tipo.indexOf('A:') === 0) return 'Domanda A · cluster ' + (DATI.clusterA.indexOf(tipo.slice(2)) + 1) + ' di ' + DATI.clusterA.length;
  return 'Domanda B';
}

// --- nome e cognome: solo lettere (anche accentate), spazi, apostrofo, trattino, punto; almeno due parole ---
function nomeValido(s) {
  s = String(s || '').trim();
  if (!/^[A-Za-zÀ-ÖØ-öø-ÿ'’.\- ]+$/.test(s)) return false;
  var parole = s.split(/\s+/).filter(function (p) { return /[A-Za-zÀ-ÖØ-öø-ÿ]/.test(p); });
  return parole.length >= 2 && s.replace(/[^A-Za-zÀ-ÖØ-öø-ÿ]/g, '').length >= 3;
}

// --- salvataggio automatico nel browser (chiave nuova: le bozze della versione precedente non vengono riprese) ---
function chiave() { return 'step3v4_' + DATI.esperto; }
function salvaLocale() { try { localStorage.setItem(chiave(), JSON.stringify(stato)); } catch (e) {} }
function caricaLocale() { try { var s = JSON.parse(localStorage.getItem(chiave()) || 'null'); if (s && s.a && s.b) { stato = Object.assign(stato, s); return true; } } catch (e) {} return false; }
function cancellaLocale() { try { localStorage.removeItem(chiave()); } catch (e) {} }

// --- completezza ---
function mancantiA(c) { return tutteCap().filter(function (cap) { var s = (stato.a[c] || {})[cap.codice]; return !s || s.length === 0; }); }
function mancantiB() { var m = []; DATI.cluster.forEach(function (cl) { tutteCap().forEach(function (cap) { var v = (stato.b[cl.codice] || {})[cap.codice]; if (v === undefined || v === '') m.push({ cl: cl.codice, cap: cap }); }); }); return m; }
function compilateB() { return DATI.cluster.length * TOTALE_CAP - mancantiB().length; }

// --- altezza della parte fissa, usata per fermare le intestazioni della tabella subito sotto ---
function misuraFisso() {
  var f = document.querySelector('.fisso');
  var h = f && getComputedStyle(f).position === 'sticky' ? f.offsetHeight : 0;
  document.documentElement.style.setProperty('--fh', h + 'px');
}
window.addEventListener('resize', misuraFisso);

  head.innerHTML = '<div class="testa"><div><p class="eyebrow">Step 3 – Risultati del focus group</p><h1>Rilevanza delle digital micro-capabilities per i cluster di sostenibilità sociale</h1></div><img src="' + LOGO + '" alt="Università del Salento"></div>' +
    '<p class="muted" style="margin:0">Risposte ricevute: <b style="color:var(--txt)">' + inviati + ' esperti su ' + R.esperti.length + '</b>. Per ogni esperto si considera il suo ultimo invio. La pagina si aggiorna a ogni apertura.</p>' +
    '<div class="chips">' + R.esperti.map(function (e) { return '<span class="chip' + (e.inviato ? ' ok' : '') + '">' + e.codice + ' · ' + esc(e.profilo) + (e.inviato ? ' ✓' : ' – in attesa') + '</span>'; }).join('') + '</div>' +
    (inviati < R.esperti.length ? '<div class="note">Risultati parziali: la regola di inclusione richiede i giudizi di tutti e sei gli esperti.</div>' : '');
  app.appendChild(head);

  var scelta = el('<div class="card"><div class="sel"><div><label for="sCap">Digital micro-capability</label><select id="sCap"></select></div><div><label for="sCl">Cluster</label><select id="sCl"></select></div></div></div>');
  var sCap = scelta.querySelector('#sCap'), sCl = scelta.querySelector('#sCl');
  R.dimensioni.forEach(function (d) {
    var g = document.createElement('optgroup'); g.label = d.nome + ' (' + d.sigla + ')';
    R.capabilities.filter(function (c) { return c.dim === d.sigla; }).forEach(function (c) { var o = document.createElement('option'); o.value = c.codice; o.textContent = c.codice + ' · ' + c.nome; g.appendChild(o); });
    sCap.appendChild(g);
  });
  R.cluster.forEach(function (cl) { var o = document.createElement('option'); o.value = cl.codice; o.textContent = cl.codice + ' – ' + cl.nome; sCl.appendChild(o); });
  sCap.onchange = function () { sel.cap = sCap.value; aggiorna(); };
  sCl.onchange = function () { sel.cl = sCl.value; aggiorna(); };
  app.appendChild(scelta);

  var c2 = el('<div class="card" id="ris2"></div>'); app.appendChild(c2);
  var c3 = el('<div class="card" id="ris3"></div>'); app.appendChild(c3);
  var c4 = el('<div class="card" id="ris4"></div>'); app.appendChild(c4);
  var c5 = el('<div class="card" id="ris5"></div>'); app.appendChild(c5);

  function aggiorna() {
    sCap.value = sel.cap; sCl.value = sel.cl;
    var cap = capDi(sel.cap), cl = clusterDi(sel.cl);
    // ---- Secondo risultato (Domanda A)
    var ass = R.esperti.filter(function (e) { return e.clusterA.indexOf(cl.codice) >= 0; });
    var risp = R.a[cl.codice][cap.codice];
    var h = '<h2>2. Secondo risultato — Quali pratiche sono supportate da una capability?</h2>' +
      '<p>Domanda A. Micro-capability <b>' + esc(cap.nome) + '</b> e cluster <b>' + esc(cl.codice + ' – ' + cl.nome) + '</b>.</p>' +
      '<p>Ogni esperto a cui è assegnato il cluster indica a quali pratiche ritiene che questa capability possa contribuire.</p>' +
      '<p class="h3" style="margin-top:18px">Risposte individuali</p><div class="tablewrap"><table class="res"><thead><tr><th>Esperto</th>' +
      cl.pratiche.map(function (p) { return '<th class="c">' + p.codice + ' – ' + esc(p.nome) + '</th>'; }).join('') + '</tr></thead><tbody>';
    var n = ass.filter(function (e) { return risp[e.codice]; }).length;
    ass.forEach(function (e) {
      var r = risp[e.codice];
      h += '<tr><td>' + e.codice + ' – ' + esc(e.profilo) + (r && r[0] === 'Nessuna' ? ' <span class="muted small">(nessuna pratica)</span>' : '') + (r && r[0] === 'NV' ? ' <span class="muted small">(non valutabile)</span>' : '') + '</td>';
      cl.pratiche.forEach(function (p) {
        h += '<td class="c">' + (!r ? '<span class="muted small">in attesa</span>' : r[0] === 'NV' ? '<span class="muted">NV</span>' : r.indexOf(p.codice) >= 0 ? '<span class="si">✓</span>' : '<span class="no">—</span>') + '</td>';
      });
      h += '</tr>';
    });
    h += '<tr class="tot"><td>Esperti concordi</td>' + cl.pratiche.map(function (p) {
      var k = ass.filter(function (e) { return risp[e.codice] && risp[e.codice].indexOf(p.codice) >= 0; }).length;
      return '<td class="c">' + (n ? k + '/' + n : '—') + '</td>';
    }).join('') + '</tr></tbody></table></div>' +
      '<p class="muted small" style="margin-top:10px">Secondo lo schema di distribuzione della guida, nella Domanda A ogni cluster è valutato da 3 esperti.</p>';
    c2.innerHTML = h;

    // ---- Terzo risultato (Domanda B)
    var st = R.stat[cl.codice][cap.codice], vb = R.b[cl.codice][cap.codice];
    var interp = st.nRisposte === 0 ? 'nessun giudizio ancora disponibile.'
      : st.esito === 'Inclusa' ? 'il contributo di ' + cap.nome + ' all\'implementazione del ' + cl.codice + ' è considerato significativo o centrale da ' + st.n23 + ' esperti su 6: la capability entra nel FAHP.'
      : st.esito === 'Esclusa' ? 'per ' + st.n0 + ' esperti su 6 ' + cap.nome + ' non dà alcun contributo identificabile al ' + cl.codice + ': la capability è esclusa dal FAHP.'
      : 'i giudizi non soddisfano né la regola di inclusione né quella di esclusione: la relazione va discussa nello Step 4, confrontando i risultati della Domanda A e della Domanda B.';
    c3.innerHTML = '<h2>3. Terzo risultato — Quanto è rilevante la capability per il cluster?</h2>' +
      '<p>Nella Domanda B, i sei esperti attribuiscono un punteggio da 0 a 3 a <i>' + esc(cap.nome) + '</i> rispetto all\'intero ' + cl.codice + '.</p>' +
      '<div class="box"><h4>' + esc(cap.nome) + ' → ' + cl.codice + '</h4><div class="scores">' +
      R.esperti.map(function (e) { var v = vb[e.codice]; return '<div><span>' + e.codice + '</span><b' + (v === undefined || v === 'NV' ? ' class="muted"' : '') + '>' + (v === undefined ? '–' : v) + '</b></div>'; }).join('') +
      '</div><div class="kpi"><div><span>Mediana della rilevanza</span><b>' + numIt(st.mediana) + '</b></div>' +
      '<div><span>Esperti con rilevanza almeno 2</span><b>' + st.n23 + '/6</b></div>' +
      '<div><span>Esperti con rilevanza 0</span><b>' + st.n0 + '/6</b></div></div>' +
      '<p style="margin:12px 0 4px">Esito secondo la regola della guida: <span class="esito e-' + st.esito.replace(' ', '') + '">' + (st.esito === 'Step 4' ? 'Da valutare nello Step 4' : st.esito + ' nel FAHP') + '</span>' + (st.nNV ? ' <span class="muted small">(' + st.nNV + ' NV)</span>' : '') + '</p>' +
      '<p class="muted" style="margin:4px 0 0">Interpretazione: ' + esc(interp) + '</p></div>';

    // ---- Quarto risultato (matrice)
    var m = '<h2>4. Quarto risultato — La matrice complessiva di rilevanza 30 × 6</h2>' +
      '<p>Per ogni relazione capability–cluster, la mediana dei sei giudizi della Domanda B. Il colore indica l\'esito della regola di inclusione; cliccando una cella si aprono il secondo e il terzo risultato di quella coppia.</p>' +
      '<div class="tablewrap"><table class="mat res"><thead><tr><th>Digital micro-capability</th>' + R.cluster.map(function (k) { return '<th class="c" title="' + esc(k.nome) + '">' + k.codice + '</th>'; }).join('') + '</tr></thead><tbody>';
    R.dimensioni.forEach(function (d) {
      m += '<tr class="dim"><td colspan="7">' + esc(d.nome) + ' (' + d.sigla + ')</td></tr>';
      R.capabilities.filter(function (c) { return c.dim === d.sigla; }).forEach(function (c) {
        m += '<tr><td>' + c.codice + ' · ' + esc(c.nome) + '</td>' + R.cluster.map(function (k) {
          var s2 = R.stat[k.codice][c.codice];
          return '<td class="e-' + s2.esito.replace(' ', '') + (c.codice === sel.cap && k.codice === sel.cl ? ' on' : '') + '" data-cap="' + c.codice + '" data-cl="' + k.codice + '" title="' + esc(c.nome + ' → ' + k.codice + ': ' + s2.esito) + '">' + numIt(s2.mediana) + '</td>';
        }).join('') + '</tr>';
      });
    });
    m += '</tbody></table></div><div class="leg"><span><span class="sw e-Inclusa"></span>Inclusa: mediana ≥ 2 e almeno ' + R.soglie.inclusione + ' esperti su 6 con 2 o 3</span>' +
      '<span><span class="sw e-Esclusa"></span>Esclusa: mediana &lt; 2 e almeno ' + R.soglie.esclusione + ' esperti su 6 con 0</span><span><span class="sw e-Step4"></span>Da valutare nello Step 4</span></div>' +
      '<p class="h3" style="margin-top:22px">Scala della Domanda B</p><table class="res"><thead><tr><th>Valore</th><th>Significato</th></tr></thead><tbody>' +
      R.scalaB.map(function (x) { var i = x.indexOf('='); return '<tr><td>' + esc(x.slice(0, i).trim()) + '</td><td>' + esc(x.slice(i + 1).trim()) + '</td></tr>'; }).join('') + '</tbody></table>';
    c4.innerHTML = m;
    c4.querySelectorAll('td[data-cap]').forEach(function (td) {
      td.onclick = function () { sel.cap = td.getAttribute('data-cap'); sel.cl = td.getAttribute('data-cl'); aggiorna(); scelta.scrollIntoView({ behavior: 'smooth' }); };
    });

    // ---- Riepilogo per cluster
    var t = '<h2>Capabilities pertinenti per cluster</h2><p>Numero di micro-capabilities per esito della regola di inclusione. Le capabilities «da valutare» vengono discusse nello Step 4 prima del questionario FAHP.</p>' +
      '<div class="tablewrap"><table class="res"><thead><tr><th>Cluster</th><th class="c">Capabilities iniziali</th><th class="c">Incluse</th><th class="c">Da valutare nello Step 4</th><th class="c">Escluse</th></tr></thead><tbody>';
    R.cluster.forEach(function (k) {
      var n2 = { 'Inclusa': 0, 'Esclusa': 0, 'Step 4': 0 };
      R.capabilities.forEach(function (c) { n2[R.stat[k.codice][c.codice].esito]++; });
      t += '<tr><td><b>' + k.codice + '</b> ' + esc(k.nome) + '</td><td class="c">' + R.capabilities.length + '</td><td class="c">' + n2['Inclusa'] + '</td><td class="c">' + n2['Step 4'] + '</td><td class="c">' + n2['Esclusa'] + '</td></tr>';
    });
    c5.innerHTML = t + '</tbody></table></div>';
  }
  aggiorna();
}

// =====================================================================
// SOLO PER I TEST – da togliere prima dell'invio agli esperti:
// mettere MODALITA_TEST = false (oppure cancellare tutto questo blocco).
// Pulsante «Test: compila questa pagina» in basso a destra, oppure Ctrl (⌃) + G + M (su Mac il tasto control,
// non command: in Safari Cmd + M riduce a icona la finestra prima che la pagina possa intercettarlo).
// =====================================================================
var MODALITA_TEST = true;
var tastiTest = {};
function riempiCasuale() {
  var tipo = passi()[stato.passo];
  var caso = function (a) { return a[Math.floor(Math.random() * a.length)]; };
  if (tipo === 'informativa') {
    stato.nome = 'Prova Test';
  } else if (tipo && tipo.indexOf('A:') === 0) {
    var cc = tipo.slice(2), pr = clusterDi(cc).pratiche.map(function (p) { return p.codice; });
    stato.a[cc] = {};
    tutteCap().forEach(function (cap) {
      var r = Math.random();
      if (r < 0.1) stato.a[cc][cap.codice] = ['Nessuna'];
      else if (r < 0.15) stato.a[cc][cap.codice] = ['NV'];
      else { var s = pr.filter(function () { return Math.random() < 0.5; }); stato.a[cc][cap.codice] = s.length ? s : [caso(pr)]; }
    });
  } else if (tipo === 'B') {
    DATI.cluster.forEach(function (cl) { stato.b[cl.codice] = {}; tutteCap().forEach(function (cap) { stato.b[cl.codice][cap.codice] = caso(['0', '1', '2', '2', '3', '3', 'NV']); }); });
  } else return;
  salvaLocale();
  var y = window.scrollY; render(); window.scrollTo(0, y);
  var t = el('<div class="toast">Test: risposte casuali inserite in questa pagina</div>');
  document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2200);
}
document.addEventListener('keydown', function (e) {
  if (!MODALITA_TEST || !DATI || DATI.errore || DATI.vista === 'risultati' || !e.ctrlKey || e.metaKey) return;
  var k = e.code === 'KeyG' ? 'g' : e.code === 'KeyM' ? 'm' : (e.key || '').toLowerCase();
  if (k !== 'g' && k !== 'm') return;
  e.preventDefault();
  tastiTest[k] = Date.now();
  if (tastiTest.g && tastiTest.m && Math.abs(tastiTest.g - tastiTest.m) < 1500) { tastiTest = {}; riempiCasuale(); }
});

// =====================================================================
// AVVIO E COLLEGAMENTO CON IL SERVER
// Pagina su Google (link /exec): i dati arrivano già nella pagina e l'invio usa google.script.run.
// Pagina esterna (index.html, es. GitHub Pages): i dati e l'invio passano per l'URL /exec indicato in API_URL,
// senza cookie né account Google (credentials: 'omit'), così l'errore "Impossibile aprire il file" non può comparire.
// =====================================================================
function parametro(n) {
  var m = new RegExp('[?&]' + n + '=([^&#]*)').exec(location.search);
  return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')).trim() : '';
}
function urlApi() { return String(window.API_URL || '').trim().replace(/[?#].*$/, ''); }

function inviaRisposte(invio, ok, ko) {
  if (window.google && google.script && google.script.run) {
    google.script.run.withSuccessHandler(ok).withFailureHandler(ko).salvaRisposte(invio);
    return;
  }
  fetch(urlApi(), { method: 'POST', credentials: 'omit', redirect: 'follow', cache: 'no-store',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(invio) })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (res) { if (res && res.ok) ok(res); else ko({ message: (res && res.errore) || 'risposta non valida del server' }); })
    .catch(function () { ko({ message: 'connessione al server non riuscita' }); });
}

function avvia() {
  app.innerHTML = '';
  if (DATI.vista === 'risultati') {
    document.title = 'Risultati Step 3 – ' + (DATI.titolo || document.title);
    renderRisultati();
  } else if (!DATI.errore && caricaLocale() && stato.passo > 0) {
    render();
    var avviso = el('<div class="note">Abbiamo ripristinato le risposte salvate su questo dispositivo: può proseguire da dove si era interrotto.</div>');
    app.insertBefore(avviso, app.children[2]);
  } else {
    render();
  }
}

function caricaDati() {
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(urlApi())) {
    app.innerHTML = '<div class="card"><h1>Pagina non configurata</h1><p>Nel file index.html manca l\'indirizzo /exec della web app Google (variabile API_URL, in cima al file).</p></div>';
    return;
  }
  app.innerHTML = '<div class="card"><p>Caricamento del questionario in corso…</p></div>';
  var q = parametro('vista') === 'risultati'
    ? '?api=risultati&chiave=' + encodeURIComponent(parametro('chiave'))
    : '?api=dati&esperto=' + encodeURIComponent(parametro('esperto'));
  fetch(urlApi() + q, { credentials: 'omit', redirect: 'follow', cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (d) { DATI = d; avvia(); })
    .catch(function () {
      app.innerHTML = '<div class="card"><h1>Impossibile caricare il questionario</h1><p>Verifichi la connessione a Internet e riprovi tra qualche istante.</p><p><button class="btn primary" id="riprova">Riprova</button></p></div>';
      document.getElementById('riprova').onclick = caricaDati;
    });
}

if (DATI) avvia(); else caricaDati();
</script>
